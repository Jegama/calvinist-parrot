name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sermon-evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RUN_SERMON_DATABASE_INTEGRATION_TESTS: "1"
      DATABASE_URL: postgresql://calvinist_parrot:calvinist_parrot@localhost:54322/calvinist_parrot_test?schema=public
      # The local CI service has no TLS; production keeps the worker's TLS default.
      SERMON_DATABASE_URL: postgresql://calvinist_parrot:calvinist_parrot@localhost:54322/calvinist_parrot_test?sslmode=disable

    defaults:
      run:
        working-directory: services/sermon-evaluator

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start test database
        working-directory: ${{ github.workspace }}
        run: docker compose up --wait postgres

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install application dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Apply Prisma migrations
        working-directory: ${{ github.workspace }}
        run: npx prisma migrate deploy

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/sermon-evaluator/requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify both worker locks against the project manifest
        run: |
          python -m piptools compile --resolver=backtracking --strip-extras -o requirements.txt pyproject.toml
          python -m piptools compile --resolver=backtracking --strip-extras --allow-unsafe --extra dev -o requirements-dev.txt pyproject.toml
          git diff --exit-code -- requirements.txt requirements-dev.txt

      - name: Install sermon evaluator
        run: python -m pip install --no-deps -e .

      - name: Test sermon evaluator
        run: python -m pytest

      - name: Verify Appwrite entrypoint import
        run: python -c "from entrypoints.appwrite import main; assert callable(main)"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RUN_SERMON_DATABASE_INTEGRATION_TESTS: "1"
      DATABASE_URL: postgresql://calvinist_parrot:calvinist_parrot@localhost:54322/calvinist_parrot_test?schema=public
      CCEL_URL: postgresql://calvinist_parrot:calvinist_parrot@localhost:54322/calvinist_parrot_test?schema=public
      ANTHROPIC_API_KEY: ci-placeholder
      GEMINI_API_KEY: ci-placeholder
      OPENAI_API_KEY: ci-placeholder
      TAVILY_API_KEY: ci-placeholder
      CRON_SECRET: ci-placeholder
      ADMIN_ID: ci-admin
      NEXT_PUBLIC_ADMIN_ID: ci-admin
      APPWRITE_ENDPOINT: http://localhost/v1
      APPWRITE_PROJECT_ID: ci-project
      APPWRITE_API_KEY: ci-placeholder
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APPWRITE_ENDPOINT: http://localhost/v1
      NEXT_PUBLIC_APPWRITE_PROJECT_ID: ci-project
      PARROT_AGENT_PROVIDER: anthropic
      PARROT_ANTHROPIC_MODEL: claude-haiku-5-5
      PARROT_OPENAI_MODEL: gpt-6-luna
      PARROT_GEMINI_MODEL: gemini-4-hydrogen
      NOMINATIM_USER_AGENT: CalvinistParrotCI/1.0 (ci@calvinistparrot.local)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start test database
        run: docker compose up --wait postgres

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Validate app
        run: npm run ci
