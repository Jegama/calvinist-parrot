name: Release

# The production site deploys from this same master commit through Vercel,
# outside Actions. Waiting on a deployment status would skip the release
# whenever that status is missing.
on:
  push:
    branches:
      - master

permissions:
  contents: write

# The default queue keeps one pending run and drops the older one. Every
# master push has to publish its own version, so pending releases stay queued.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Fetch the previous master commit
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --depth=1 origin "$BEFORE_SHA"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/publish-github-release.mjs
